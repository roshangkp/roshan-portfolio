<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio QR Generator | Roshan Chaurasiya</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .qr-page { min-height: 100vh; display: grid; place-items: center; padding: 30px; }
    .qr-box { width: min(650px, 100%); text-align: center; padding: 35px; }
    .qr-box h1 { font-size: clamp(32px, 7vw, 58px); margin-bottom: 10px; }
    .qr-box p { color: var(--muted); margin-bottom: 20px; }
    .url-input {
      width: 100%; padding: 14px; border-radius: 10px;
      border: 1px solid var(--border); background: rgba(0,0,0,.25);
      color: white; font: inherit; margin-bottom: 15px;
    }
    #qrcode {
      width: fit-content; margin: 25px auto; padding: 15px;
      background: white; border-radius: 12px;
    }
    .back { display: inline-block; margin-top: 8px; color: var(--accent); }
  </style>
</head>
<body>
  <main class="qr-page">
    <section class="qr-box hero-card">
      <p class="eyebrow">Portfolio QR Code</p>
      <h1>Scan → <span>Portfolio</span></h1>
      <p>Enter your published portfolio URL and generate a QR code.</p>

      <input
        class="url-input"
        id="urlInput"
        type="url"
        placeholder="https://your-username.github.io/roshan-portfolio/"
      >

      <button class="btn primary" id="generateBtn">Generate QR Code</button>

      <div id="qrcode"></div>

      <button class="btn secondary" id="downloadBtn">Download QR</button>
      <br>
      <a class="back" href="index.html">← Back to portfolio</a>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    const urlInput = document.getElementById("urlInput");
    const qrcode = document.getElementById("qrcode");

    const currentDefault =
      window.location.origin + window.location.pathname.replace("qr.html", "index.html");

    urlInput.value = currentDefault;

    function generateQR() {
      const url = urlInput.value.trim();

      if (!url) {
        alert("Please enter your portfolio URL.");
        return;
      }

      qrcode.innerHTML = "";

      new QRCode(qrcode, {
        text: url,
        width: 260,
        height: 260,
        colorDark: "#111111",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    document.getElementById("generateBtn").addEventListener("click", generateQR);

    document.getElementById("downloadBtn").addEventListener("click", () => {
      const canvas = qrcode.querySelector("canvas");
      const image = qrcode.querySelector("img");

      const source = canvas ? canvas.toDataURL("image/png") : image?.src;

      if (!source) {
        alert("Generate the QR code first.");
        return;
      }

      const a = document.createElement("a");
      a.href = source;
      a.download = "roshan-portfolio-qr.png";
      a.click();
    });

    generateQR();
  </script>
</body>
</html>
